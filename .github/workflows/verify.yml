name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-architecture:
    name: Unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and architecture tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test

  docker-testcontainers-baseline:
    name: Docker Testcontainers baseline
    needs: unit-and-architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run PostgreSQL integration test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Dit.test=PostgresExampleIT

  docker-system-smoke:
    name: AML Docker system smoke
    if: ${{ vars.SYSTEM_PROOF_DOCKER_RUNNER_ENABLED == 'true' }}
    needs: unit-and-architecture
    runs-on:
      - self-hosted
      - Windows
      - X64
      - system-proof
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Docker prerequisites
        shell: pwsh
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is not available"
          }

          $containerOs = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $containerOs -ne "linux") {
            throw "Docker must run Linux containers"
          }

          @(
            "system-proof-ingestion-service:local"
            "aml-smsc-simulator:local"
          ) | ForEach-Object {
            docker image inspect $_ | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Required Docker image is missing: $_"
            }
          }
      - name: Run full verification
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
